<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t">
  <title id="t">Abyssal Battleships — battleships against an opponent that remembers where you hide your fleet</title>
  <defs>
    <style>
      :root{ --accent:#0d9488; --accent2:#5b4bd6; --on:#ffffff; --chip:#ffffff26; --sub:#ffffffd9; --grid:#ffffff1f; }
      @media (prefers-color-scheme: dark){ :root{ --accent:#0b7d72; --accent2:#4a3bc0; } }
      text{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    </style>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--accent)"/>
      <stop offset="1" stop-color="var(--accent2)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="360" rx="24"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="360" rx="24" fill="url(#hero)"/>

  <!-- sonar rings + grid, clipped to the rounded banner -->
  <g clip-path="url(#round)" opacity="0.9">
    <g fill="none" stroke="var(--grid)" stroke-width="1.5">
      <circle cx="1010" cy="180" r="60"/>
      <circle cx="1010" cy="180" r="105"/>
      <circle cx="1010" cy="180" r="150"/>
      <line x1="860" y1="180" x2="1160" y2="180"/>
      <line x1="1010" y1="30" x2="1010" y2="330"/>
    </g>
    <g fill="#ffffff">
      <circle cx="1052" cy="140" r="5" opacity="0.95"/>
      <circle cx="978" cy="221" r="4" opacity="0.75"/>
      <circle cx="1084" cy="212" r="3.5" opacity="0.6"/>
      <circle cx="963" cy="146" r="3" opacity="0.5"/>
      <circle cx="1030" cy="252" r="3" opacity="0.45"/>
    </g>
  </g>

  <rect x="0" y="0" width="1200" height="360" rx="24" fill="url(#glow)"/>

  <text x="80" y="138" font-size="58" font-weight="800" fill="var(--on)" letter-spacing="-1">ABYSSAL BATTLESHIPS</text>
  <text x="82" y="184" font-size="24" font-weight="400" fill="var(--sub)">Classic battleships against an opponent that remembers where you hide your fleet.</text>

  <g font-size="16" font-weight="600" fill="var(--on)">
    <rect x="80"  y="228" width="238" height="44" rx="22" fill="var(--chip)"/><text x="104" y="256">🧠 Learns across games</text>
    <rect x="334" y="228" width="196" height="44" rx="22" fill="var(--chip)"/><text x="358" y="256">🔒 Sealed AI shots</text>
    <rect x="546" y="228" width="176" height="44" rx="22" fill="var(--chip)"/><text x="570" y="256">📡 Live telemetry</text>
    <rect x="738" y="228" width="118" height="44" rx="22" fill="var(--chip)"/><text x="762" y="256">⚡ No build</text>
  </g>
</svg>
