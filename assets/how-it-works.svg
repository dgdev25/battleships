<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t">
  <title id="t">How the opponent learns: a finished game becomes one memory per square, which is recalled and voted on before every future shot</title>
  <defs>
    <style>
      :root{ --bg:#ffffff;--surface:#f6f8fa;--border:#d0d7de;--ink:#1f2328;--muted:#656d76;--accent:#0d9488;--accent2:#5b4bd6;--on:#ffffff; }
      @media (prefers-color-scheme: dark){ :root{ --bg:#0d1117;--surface:#161b22;--border:#30363d;--ink:#e6edf3;--muted:#8b949e;--accent:#2fe0cf;--accent2:#9d8cff; } }
      text{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
      .card{ fill:var(--surface); stroke:var(--border); stroke-width:1.5; }
      .t{ fill:var(--ink); font-weight:600; }
      .d{ fill:var(--muted); }
      .num{ fill:var(--on); font-weight:700; }
      .edge{ stroke:var(--accent); stroke-width:2; fill:none; }
      .loop{ stroke:var(--accent2); stroke-width:2; fill:none; stroke-dasharray:6 5; }
      .looplbl{ fill:var(--accent2); font-weight:600; }
    </style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2)"/></marker>
  </defs>

  <rect width="1200" height="400" fill="var(--bg)"/>
  <text x="60" y="58" font-size="27" class="t">How the opponent reads you</text>
  <text x="60" y="86" font-size="14" class="d">One finished game turns into 100 small memories. Every later shot is a vote among the memories that look like right now.</text>

  <!-- stage 1 -->
  <g>
    <rect class="card" x="60" y="124" width="250" height="150" rx="14"/>
    <circle cx="96" cy="160" r="18" fill="url(#g)"/><text class="num" x="96" y="166" font-size="16" text-anchor="middle">1</text>
    <text class="t" x="128" y="166" font-size="18">You finish a game</text>
    <text class="d" x="84" y="208" font-size="13">Win or lose, the true position</text>
    <text class="d" x="84" y="228" font-size="13">of your fleet is now known.</text>
    <text class="d" x="84" y="252" font-size="13" style="fill:var(--accent)">17 hull squares of 100</text>
  </g>
  <line class="edge" x1="318" y1="199" x2="352" y2="199" marker-end="url(#a)"/>

  <!-- stage 2 -->
  <g>
    <rect class="card" x="360" y="124" width="250" height="150" rx="14"/>
    <circle cx="396" cy="160" r="18" fill="url(#g)"/><text class="num" x="396" y="166" font-size="16" text-anchor="middle">2</text>
    <text class="t" x="428" y="166" font-size="18">Every square is noted</text>
    <text class="d" x="384" y="208" font-size="13">A short code per square —</text>
    <text class="d" x="384" y="228" font-size="13">edge, corner, parity, band —</text>
    <text class="d" x="384" y="252" font-size="13">stored with: hull, or water.</text>
  </g>
  <line class="edge" x1="618" y1="199" x2="652" y2="199" marker-end="url(#a)"/>

  <!-- stage 3 -->
  <g>
    <rect class="card" x="660" y="124" width="250" height="150" rx="14"/>
    <circle cx="696" cy="160" r="18" fill="url(#g)"/><text class="num" x="696" y="166" font-size="16" text-anchor="middle">3</text>
    <text class="t" x="728" y="166" font-size="18">ruvector recalls</text>
    <text class="d" x="684" y="208" font-size="13">Each note becomes 64 numbers.</text>
    <text class="d" x="684" y="228" font-size="13">Before a shot it finds the</text>
    <text class="d" x="684" y="252" font-size="13">closest notes it has seen.</text>
  </g>
  <line class="edge" x1="918" y1="199" x2="952" y2="199" marker-end="url(#a)"/>

  <!-- stage 4 -->
  <g>
    <rect class="card" x="960" y="124" width="180" height="150" rx="14"/>
    <circle cx="996" cy="160" r="18" fill="url(#g)"/><text class="num" x="996" y="166" font-size="16" text-anchor="middle">4</text>
    <text class="t" x="1028" y="166" font-size="18">It fires</text>
    <text class="d" x="984" y="208" font-size="13">Closer and newer</text>
    <text class="d" x="984" y="228" font-size="13">memories vote</text>
    <text class="d" x="984" y="252" font-size="13">harder. Best cell wins.</text>
  </g>

  <!-- feedback loop -->
  <path class="loop" d="M1050,282 L1050,336 L185,336 L185,282" marker-end="url(#b)"/>
  <text class="looplbl" x="600" y="362" font-size="14" text-anchor="middle">every finished game adds 100 more memories — the read gets sharper each time you play</text>
</svg>
